<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Mono';
        src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 800;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background:
          radial-gradient(700px 480px at 86% 46%, rgba(255, 122, 89, 0.2), transparent 70%),
          radial-gradient(560px 380px at 6% 104%, rgba(242, 193, 78, 0.1), transparent 70%), #15100d;
        color: #f4ebdd;
        font-family: 'Bricolage', system-ui, sans-serif;
        display: grid;
        grid-template-columns: 610px 1fr;
      }
      .text { padding: 62px 0 54px 68px; display: flex; flex-direction: column; }
      .brand { font-size: 31px; font-weight: 700; letter-spacing: -0.01em; }
      .brand b { color: #ff7a59; font-weight: 800; }
      .brand span { font-family: 'Mono'; font-size: 16px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #ab9c8c; margin-left: 14px; }
      h1 { margin-top: 66px; font-size: 69px; line-height: 0.98; font-weight: 760; letter-spacing: -0.035em; }
      h1 em { font-style: normal; color: #ff7a59; }
      p { margin-top: 26px; font-size: 29px; line-height: 1.3; color: #d9cdbd; max-width: 500px; }
      .url { margin-top: auto; font-family: 'Mono'; font-size: 21px; color: #ab9c8c; }
      .map { position: relative; }
      svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .n { position: absolute; width: 190px; padding: 15px 18px 16px; border-radius: 16px; background: #1f1814; border: 2px solid #3b2f27; font-size: 26px; font-weight: 680; box-shadow: 0 22px 44px -22px #000; }
      .n::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 5px; border-radius: 3px; background: var(--c); }
      .n small { display: block; margin-top: 5px; font-family: 'Mono'; font-size: 13.5px; font-weight: 400; color: #ab9c8c; }
      .hot { border-color: var(--c); box-shadow: 0 0 0 2px var(--c), 0 0 60px -6px var(--c); }
      .card { position: absolute; left: 22px; top: 276px; width: 76px; height: 54px; border-radius: 9px; background: #f6ecd6; box-shadow: 0 0 0 7px rgba(246, 236, 214, 0.18), 0 16px 30px -10px #000; }
      .card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 9px; border-radius: 9px 9px 0 0; background: #ff7a59; }
      .card i { position: absolute; left: 12px; height: 5px; border-radius: 3px; background: rgba(42, 29, 20, 0.4); }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="brand">h<b>IA</b>tools<span>tutorial interativo</span></div>
      <h1>Como montar um <em>agente de IA</em></h1>
      <p>Siga um pedido por dentro do agente e veja cada peça trabalhando.</p>
      <div class="url">tutorial.hiatools.com.br</div>
    </div>
    <div class="map">
      <svg viewBox="0 0 590 630" fill="none" stroke="#6b5a4c" stroke-width="3" stroke-linecap="round">
        <path d="M98 303 H150" />
        <path d="M245 260 V150 Q245 132 263 132 H330" />
        <path d="M425 176 V250" stroke="#ff7a59" />
        <path d="M425 350 V440" />
        <path d="M330 300 H300 Q282 300 282 318 V470 Q282 488 264 488 H250" stroke-dasharray="3 11" />
      </svg>
      <div class="card"><i style="top: 22px; width: 52px"></i><i style="top: 34px; width: 32px"></i></div>
      <div class="n" style="left: 150px; top: 260px; --c: #63b8de">Guardrails<small>a porta</small></div>
      <div class="n" style="left: 330px; top: 88px; --c: #b9a0f2">Cache<small>respostas prontas</small></div>
      <div class="n hot" style="left: 330px; top: 252px; --c: #ff7a59">LLM<small>o cérebro</small></div>
      <div class="n" style="left: 330px; top: 440px; --c: #f2c14e">RAG<small>consulta o cardápio</small></div>
      <div class="n" style="left: 60px; top: 444px; --c: #7fca84">MCP<small>as ferramentas</small></div>
    </div>
  </body>
</html>
